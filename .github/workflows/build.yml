name: Build app packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  # 检查不阻断出包；测试按 2026-09-21 约定暂停，结果仅供参考。
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test integration_test test_driver
      - run: dart analyze lib test integration_test test_driver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true
        continue-on-error: true
      - run: flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
        continue-on-error: true
      - run: go test -race ./...
        working-directory: native
        continue-on-error: true
      - run: go test -race -ldflags="-X duanjuapp/native/core.buildAllSources=true" ./...
        working-directory: native
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Add sdkmanager to PATH
        run: |
          SDKM_BIN=$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path '*/bin/*' | head -1)")
          echo "$SDKM_BIN" >> "$GITHUB_PATH"
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
      - run: python scripts/build_android.py --abi arm64-v8a ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload resolved pubspec.lock
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+/-/')
          TAG="v$VERSION"
          gh release create "$TAG" dist/android/* \
            --title "真果鉴/红果鉴 $TAG 预览版（arm64-v8a）" \
            --notes "Android arm64-v8a APK，支持 Android 6.0+（配置签名 Secrets 时为正式签名，否则为 debug 预览）。安装时可能提示未知来源。" \
            || gh release upload "$TAG" dist/android/* --clobber
